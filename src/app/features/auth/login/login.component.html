<div class="min-vh-100 d-flex align-items-center justify-content-center p-3"
     style="background: linear-gradient(135deg, #0d6efd 0%, #6f42c1 100%)">
  <div class="card ga-card w-100" style="max-width: 420px">
    <div class="card-body p-4 p-md-5">
      <div class="text-center mb-4">
        <img src="favicon.svg" alt="" width="56" height="56" class="mb-2">
        <h1 class="h4 mb-0">Gestión Académica</h1>
        <p class="text-secondary small">Inicia sesión para continuar</p>
      </div>

      @if (sesionExpirada) {
        <div class="alert alert-warning py-2 small">
          <i class="bi bi-clock-history"></i> Tu sesión expiró. Vuelve a iniciar sesión.
        </div>
      }
      @if (errorLogin) {
        <div class="alert alert-danger py-2 small" role="alert">
          <i class="bi bi-exclamation-circle"></i> {{ errorLogin }}
        </div>
      }

      <form [formGroup]="formulario" (ngSubmit)="ingresar()" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Correo institucional</label>
          <input id="email" type="email" class="form-control" formControlName="email" autocomplete="username"
                 placeholder="usuario@idat.edu.pe" appAutofocus [class.is-invalid]="campoInvalido('email')">
          <div class="invalid-feedback">Ingresa un correo válido.</div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-group has-validation">
            <input id="password" class="form-control" formControlName="password" autocomplete="current-password"
                   [type]="mostrarPassword ? 'text' : 'password'" [class.is-invalid]="campoInvalido('password')">
            <button class="btn btn-outline-secondary" type="button" (click)="mostrarPassword = !mostrarPassword"
                    [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
              <i class="bi" [class.bi-eye]="!mostrarPassword" [class.bi-eye-slash]="mostrarPassword"></i>
            </button>
            <div class="invalid-feedback">Mínimo 6 caracteres.</div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="enviando">
          @if (enviando) {
            <span class="spinner-border spinner-border-sm me-1"></span> Ingresando...
          } @else {
            <i class="bi bi-box-arrow-in-right"></i> Ingresar
          }
        </button>
      </form>

      <hr class="my-4">
      <p class="small text-secondary mb-2">Cuentas de prueba:</p>
      <div class="d-flex flex-wrap gap-2">
        @for (cuenta of cuentasDemo; track cuenta.email) {
          <button type="button" class="btn btn-sm btn-outline-secondary" (click)="usarCuenta(cuenta)">
            {{ cuenta.rol }}
          </button>
        }
      </div>
    </div>
  </div>
</div>
